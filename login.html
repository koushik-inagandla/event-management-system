<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">TicketBook</div>
</nav>

<div class="auth-container">
    <h2>Customer Login</h2>

    <form>
        <input type="text" name="username" id="user" placeholder="Username" required>
        <input type="password" name="password" id="pass" placeholder="Password" required>
        <button type="button" class="btn" onclick="userLogin()">Login</button>
    </form>
    <script>
    function userLogin(){
        let u = user.value;
        let p = pass.value;

        fetch("api/customer_login.php", {
            method:"POST",
            body: new URLSearchParams({username:u, password:p})
        })
        .then(res => res.text())
        .then(d => {
            if(d =="success"){
                window.location="mybookings.html";
            } else {
                alert("Invalid User");
            }
        });
    }
    </script>
    <br>


    <p style="margin-top: 15px;">Are you an Admin?</p>
    <a href="login_admin.html" style="color:#3A57E8; font-weight:bold; text-decoration:none;">
        ► Login as Admin
    </a>

    <p style="margin-top: 12px;">Don't have an account? <a href="signup.html">Sign up</a></p>
</div>

</body>
</html>
