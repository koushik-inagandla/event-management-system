<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar"><div class="logo">TicketBook</div></nav>

<div class="auth-container">
    <h2>Admin Login</h2>

    <input id="user" placeholder="Admin Username">
    <input id="pass" type="password" placeholder="Password">

    <button class="btn" onclick="adminLogin()">Login</button>
</div>

<script>
function adminLogin(){
    let u = user.value;
    let p = pass.value;

    fetch("api/admin_login.php", {
        method:"POST",
        body: new URLSearchParams({username:u, password:p})
    })
    .then(res => res.text())
    .then(d => {
        if(d=="success"){
            window.location="addevent.html";
        } else {
            alert("Invalid Admin");
        }
    });
}
</script>

</body>
</html>
