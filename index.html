<!DOCTYPE html>
<html>
<head>
    <title>TicketBook - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">TicketBook</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
    </ul>
    <a class="login-btn" href="login.html">Login</a>
</nav>

<section class="hero">
    <h1>Book Tickets Instantly</h1>
    <p>Your favourite events, movies & concerts — all in one place</p>
</section>

<section class="event-section">
    <h2>Upcoming Events</h2>

    <div id="events" class="event-grid"></div>
</section>

<script>
fetch("api/fetch_events.php")
.then(res => res.json())
.then(data => {
    let box = document.getElementById("events");

    data.forEach(e => {
        box.innerHTML += `
        <div class="event-card">
            <img src="${e.image}">
            <h3>${e.title}</h3>
            <p>Venue: ${e.venue}</p>
            <p>Date: ${e.date}</p>
            <a class="btn" href="event.html?id=${e.EventId}">View Details</a>
        </div>`;
    });
});
</script>

</body>
</html>
